l_english:
 # Clan Cohesion Mechanic (Wildlings)
 ability_clan_cohesion_mechanic: "Clan Cohesion"
 clan_cohesion: "Clan Cohesion"
 clan_cohesion_desc: "The free folk living beyond the wall live in a stateless society, with the only semblence of leadership being a single chieftain keeping the clan together. Should the clan leader fail to maintain the cohesion of the clan, he will be ousted in a rather... hostile manner.\n\n§YClan Cohesion§! is gained by:\n - Ruler Skills (§G2:1§!/§Yscaled§!)\n - Positive Stability (§G0.10§!/§Ylvl§!)\n - Being at War (§G0.10§!)\n - High Power Projection (§G+0.50§!/§Yscaled§!)\n - Certain §YGovernment Reforms§!\n§YClan Cohesion§! is lost by:\n - High Clan Cohesion (§Yscaled§!)\n - Negative Stability (§R-0.20§!/§Ylvl§!)\n - Being at Peace (§R-0.05§!)\n - Corruption (§R-1.0§!/§Yscaled§!)\n - Certain §YGovernment Reforms§!\n "
 ousted_clan_ruler_tt: "The leading family (§Y[Root.Monarch.Dynasty.GetName]§!) will be ousted."
 monthly_clan_cohesion: "Monthly Clan Cohesion"
 clan_cohesion_gain_modifier: "Clan Cohesion Gain Modifier"

 # Orders of the Watch Mechanic (Night's Watch)
 ability_nights_watch_orders_mechanic: "Orders of the Watch"
 stewards_loyalty: "Stewards' Loyalty"
 stewards_loyalty_desc: "The Order of Stewards is one of three orders of the Night's Watch, responsible for an assortment of critical functions to provide vital day-to-day services.\n\n§YStewards' Loyalty§! is gained by:\n - Base Growth (§G+0.12§!)\n - Positive Stability (§G+0.10§!/§Ylvl§!)\n - Support from the South (§G+0.05§!)\n - Ruler Administrative Skill (§Yscaled§!)\n - Certain §YGovernment Reforms§!\n§YStewards' Loyalty§! is lost by:\n - Negative Stability (§R-0.20§!/§Ylvl§!)\n - Certain §YGovernment Reforms§!\n\nDecisions and Events may also affect the §YLoyalty§! scale, altering the scales either positively or negatively.\n "
 monthly_stewards_loyalty: "Monthly Stewards' Loyalty"
 stewards_loyalty_gain_modifier: "Stewards' Loyalty Gain Modifier"
 builders_loyalty: "Builders' Loyalty"
 builders_loyalty_desc: "The Order of Builders is one of three orders of the Night's Watch, responsible for tending to and maintaining the Wall and its castles.\n\n§YBuilders' Loyalty§! is gained by:\n - Base Growth (§G+0.12§!)[Root.GetOrderBuildersDLC]\n - Ruler Diplomatic Skill (§Yscaled§!)\n - Certain §YGovernment Reforms§!\n§YBuilders' Loyalty§! is lost by:\n - Being at War (§R-0.05§!)\n - Religious Unity (§R-1.0§!/§Yscaled§!)\n - Certain §YGovernment Reforms§!\n\nDecisions and Events may also affect the §YLoyalty§! scale, altering the scales either positively or negatively.\n "
 monthly_builders_loyalty: "Monthly Builders' Loyalty"
 builders_loyalty_gain_modifier: "Builders' Loyalty Gain Modifier"
 rangers_loyalty: "Rangers' Loyalty"
 rangers_loyalty_desc: "The Order of Rangers is one of three orders of the Night's Watch, responsible for scouting and patrolling the Haunted Forest just beyond the Wall.\n\n§YRangers' Loyalty§! is gained by:\n - Base Growth (§G+0.12§!)\n - High Army Tradition (§G0.25§!/§Yscaled§!)\n - Ruler Military Skill (§Yscaled§!)\n - Certain §YGovernment Reforms§!\n§YRangers' Loyalty§! is lost by:\n - Being at Peace (§R-0.10§!)\n - High War Exhaustion (§R-0.05§!/§Ylvl§!)\n - Certain §YGovernment Reforms§!\n\nDecisions and Events may also affect the §YLoyalty§! scale, altering the scales either positively or negatively.\n "
 monthly_rangers_loyalty: "Monthly Rangers' Loyalty"
 rangers_loyalty_gain_modifier: "Rangers' Loyalty Gain Modifier"
 promote_loyalty_stewards: "Secure Provisions for the Watch"
 promote_loyalty_stewards_desc: "Allocate our limited resources to the §YOrder of Stewards§! to procure additionally resources for the Watch, guaranteeing the safety of the whole order.\n\n§RYou may only activate one effect from any §YOrder§! of the Watch every five years.§!\n "
 promote_loyalty_builders: "Fortify Castles along the Wall"
 promote_loyalty_builders_desc: "Allocate our limited resources to the §YOrder of Builders§! to fortify all of our defensive structures along the Wall, allowing the defenders to fight back effectively.\n\n§RYou may only activate one effect from any §YOrder§! of the Watch every five years.§!\n "
 order_builders_defense_bonus_tt: "Every province in the §YWestwatch§! and §YEastwatch§! areas which do NOT have the modifier §YAbandoned Castle§! will also receive the same modifier.\n"
 promote_loyalty_rangers: "Prepare the Brothers for Battle"
 promote_loyalty_rangers_desc: "Allocate our limited resources to the §YOrder of Rangers§! to prepare for a future armed conflict with the Wildlings, training them for all possible encounters.\n\n§RYou may only activate one effect from any §YOrder§! of the Watch every five years.§!\n "

 # Office of the Sealord Mechanic (Braavos)
 ability_office_of_the_sealord_mechanic: "Office of the Sealord"
 sealord_influence: "Leverage"
 sealord_influence_desc: "In the great Free City of Braavos, the government is led by an elected ruler, the §YSealord§!. Despite leading the government, the Sealord is often subject to the whims of the §YMagisters§! and §YKeyholders§! of Braavos, who can be said to hold the real power of the country. That is, unless the Sealord's leverage outweighs theirs...\n\n§YLeverage§! will drift towards an equillibrium of §Y60.00§!.\n - Base Growth (§G+0.20§!)\n§YLeverage§! is gained by:\n - Positive Stability (§G+0.05§!/§Ylvl§!)\n - Positive Prestige (§G+0.50§!/§Yscaled§!)\n - Ruler Skills (§G1:1§!/§Yscaled§!)\n§YLeverage§! is lost by:\n - Negative Stability (§R-0.10§!/§Ylvl§!)\n - High Corruption (§R-1.00§!/§Yscaled§!)\n - Low Republican Tradition (§R-0.50§!/§Yscaled§!)\n - Low Religious Unity (§R-0.25§!/§Yscaled§!)\n\n"
 monthly_sealord_influence: "Monthly Leverage"
 sealord_influence_gain_modifier: "Leverage Gain Modifier"
 ousted_ruler_tt: "Sealord §Y[Root.Monarch.GetName]§! will be ousted."

 # Vassal Taxation Mechanic
 sk_event.500.title: "Demand Oaths of Fealty"
 sk_event.500.desc: "The realm is in a state of unrest, and it is imperative that we ensure the loyalty of our vassal lords. We will demand that all of our vassal lords swear oaths of fealty to us, pledging their allegiance and support in these trying times. Some of our more unruly vassals may not find this demand to be in their best interest. A public declaration against our authority could mean rebellion in the future. We will be notified if any of our subjects refuse to bend the knee.\n\nWe will owe §G10§! favors to every vassal who kneels.\nEvery vassal lord who refuses to kneel will be §Routraged§! by our unacceptable decision."
 sk_event.500.option.a: "They will kneel before me!"
 sk_event.500.option.b: "Perhaps this is not the best approach."

 sk_event.501.title: "An Oath of Fealty"
 sk_event.501.desc: "An envoy from our liege-lord, [Root.Overlord.Monarch.GetTitle] [Root.Overlord.Monarch.GetName], has arrived with a request to demonstrate our loyalty with an pledge. Though it's just a public display, it can have a meaningful effect on relations one way or another."
 sk_event.501.option.a: "Bend the knee."
 sk_event.501.option.b: "Expel the envoy."
 we_kneel_tt: "§Y[Root.Monarch.GetTitle] [Root.Monarch.GetName]§! will kneel to §Y[Root.Overlord.Monarch.GetTitle] [Root.Overlord.Monarch.GetName]§!."
 we_dont_kneel_tt: "§Y[Root.Monarch.GetTitle] [Root.Monarch.GetName]§! will §RNOT§! kneel to §Y[Root.Overlord.Monarch.GetTitle] [Root.Overlord.Monarch.GetName]§!."
 
 sk_event.502.title: "Steward's Report: Oaths of Fealty"
 sk_event.502.desc: "Our stewards have compiled a report for us showing us which of our lords bent the knee and which have decided to stand against us."
 sk_event.502.option.a: "Most unfortunate."
 subjects_who_didnt_kneel_tt: "§Y[This.Monarch.GetTitle] [This.Monarch.GetName]§! did not kneel."

 sk_event.503.title: "The Lords' Tax"
 sk_event.503.desc: "In dire times, it is sometimes necessary, for the good of the realm, to levy additional taxes on our vassal lords. We will demand that all of our vassal lords pay a §R25%§! tax, which will be used to maintain the realm and fund our armies. This is a temporary measure, but no doubt our vassals will be displeased with this decision. We must be cautious, as this may lead to a loss of trust and opinion from our vassals, and possibly even rebellion. We must weigh the benefits of this tax against the potential consequences.\n\nEvery vassal lord will provide §G25%§! of their current treasury as tribute and will be greatly upset with us. Historical friends will only provide §G10%§! of their current treasury as tribute."
 sk_event.503.option.a: "They will pay their dues!"
 sk_event.503.option.b: "Perhaps this is not the best approach."
 vassal_tax_tt: "[This.Monarch.GetTitle] §Y[This.Monarch.GetName]§! pays §Y[vassal_tax.GetValue]§! ducats to §Y[Root.GetName]§!."
 vassal_tax_reduced_tt: "[This.Monarch.GetTitle] §Y[This.Monarch.GetName]§! pays §Y[vassal_tax_reduced.GetValue]§! ducats to §Y[Root.GetName]§!."

 sk_event.506.title: "The Abdication Faction"
 sk_event.506.desc: "After gathering our strength for the last year, our allies meet with us in [Root.Capital.GetName]. We all know our liege-lord, [Root.Overlord.Monarch.GetTitle] [Root.Overlord.Monarch.GetName] [Root.Overlord.Monarch.Dynasty.GetName] will not give up his seat without a fight. We can either drop our demands to avoid bloodshed or press forward on the field of battle. We may not come out on top, and the loss may be devasting should we fail to achieve our goal. Come what may, our allies will help us."
 sk_event.506.option.a: "We march on §Y[Root.Overlord.Capital.GetName]§!."
 sk_event.506.option.b: "Drop the demands"