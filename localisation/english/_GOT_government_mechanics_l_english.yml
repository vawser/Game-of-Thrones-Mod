l_english:
 # Clan Cohesion Mechanic (Wildlings)
 ability_clan_cohesion_mechanic: "Clan Cohesion"
 clan_cohesion: "Clan Cohesion"
 clan_cohesion_desc: "The free folk living beyond the wall live in a stateless society, with the only semblence of leadership being a single chieftain keeping the clan together. Should the clan leader fail to maintain the cohesion of the clan, he will be ousted in a rather... hostile manner.\n\n§YClan Cohesion§! is gained by:\n - Ruler Skills (scaled)\n - Positive Stability (§G0.10§!/lvl)\n - Being at War (§G0.10§!)\n - Power Projection (§G+0.50§!, scaled)\n - Certain §YGovernment Reforms§!\n§YClan Cohesion§! is lost by:\n - High Clan Cohesion (scaled)\n - Negative Stability (§R-0.20§!/lvl)\n - Being at Peace (§R-0.05§!)\n - Corruption (§R-1.0§!, scaled)\n - Certain §YGovernment Reforms§!\n "
 ousted_clan_ruler_tt: "The leading family (§Y[Root.Monarch.Dynasty.GetName]§!) will be ousted."
 monthly_clan_cohesion: "Monthly Clan Cohesion"
 clan_cohesion_gain_modifier: "Clan Cohesion Gain Modifier"
 rally_local_clans: "Rally Local Clans"
 rally_local_clans_desc: "Contact the local wildling clans to improve our standing with them and possibly combine forces, further progressing the possibility of a united §MFree Folk§! state.\n "

 # Orders of the Watch Mechanic (Night's Watch)
 ability_nights_watch_orders_mechanic: "Orders of the Watch"
 stewards_loyalty: "Stewards' Loyalty"
 stewards_loyalty_desc: "The Order of Stewards is one of three orders of the Night's Watch, responsible for an assortment of critical functions to provide vital day-to-day services.\n\n§YStewards' Loyalty§! is gained by:\n - Base Growth (§G+0.12§!)\n - Positive Stability (§G+0.10§!/lvl)\n - Support from the South (§G+0.05§!)\n - Ruler Administrative Skill (§Yscaled§!)\n - Certain §YGovernment Reforms§!\n§YStewards' Loyalty§! is lost by:\n - Negative Stability (§R-0.20§!/lvl)\n - Certain §YGovernment Reforms§!\n\nDecisions and Events may also affect the §YLoyalty§! scale, altering the scales either positively or negatively.\n "
 monthly_stewards_loyalty: "Monthly Stewards' Loyalty"
 stewards_loyalty_gain_modifier: "Stewards' Loyalty Gain Modifier"
 builders_loyalty: "Builders' Loyalty"
 builders_loyalty_desc: "The Order of Builders is one of three orders of the Night's Watch, responsible for tending to and maintaining the Wall and its castles.\n\n§YBuilders' Loyalty§! is gained by:\n - Base Growth (§G+0.12§!)[Root.GetOrderBuildersDLC]\n - Ruler Diplomatic Skill (§Yscaled§!)\n - Certain §YGovernment Reforms§!\n§YBuilders' Loyalty§! is lost by:\n - Being at War (§R-0.05§!)\n - Religious Unity (§Yscaled§!)\n - Certain §YGovernment Reforms§!\n\nDecisions and Events may also affect the §YLoyalty§! scale, altering the scales either positively or negatively.\n "
 monthly_builders_loyalty: "Monthly Builders' Loyalty"
 builders_loyalty_gain_modifier: "Builders' Loyalty Gain Modifier"
 rangers_loyalty: "Rangers' Loyalty"
 rangers_loyalty_desc: "The Order of Rangers is one of three orders of the Night's Watch, responsible for scouting and patrolling the Haunted Forest just beyond the Wall.\n\n§YRangers' Loyalty§! is gained by:\n - Base Growth (§G+0.12§!)\n - Army Tradition (§Yscaled§!)\n - Ruler Military Skill (§Yscaled§!)\n - Certain §YGovernment Reforms§!\n§YRangers' Loyalty§! is lost by:\n - Being at Peace (§R-0.10§!)\n - War Exhaustion (§R-0.05§!/lvl)\n - Certain §YGovernment Reforms§!\n\nDecisions and Events may also affect the §YLoyalty§! scale, altering the scales either positively or negatively.\n "
 monthly_rangers_loyalty: "Monthly Rangers' Loyalty"
 rangers_loyalty_gain_modifier: "Rangers' Loyalty Gain Modifier"
 promote_loyalty_stewards: "Secure Provisions for the Watch"
 promote_loyalty_stewards_desc: "Allocate our limited resources to the §YOrder of Stewards§! to procure additionally resources for the Watch, guaranteeing the safety of the whole order.\n\n§RYou may only activate one effect from any §YOrder§! of the Watch every five years.§!\n "
 promote_loyalty_builders: "Fortify Castles along the Wall"
 promote_loyalty_builders_desc: "Allocate our limited resources to the §YOrder of Builders§! to fortify all of our defensive structures along the Wall, allowing the defenders to fight back effectively.\n\n§RYou may only activate one effect from any §YOrder§! of the Watch every five years.§!\n "
 order_builders_defense_bonus_tt: "Every province in the §YWestwatch§! and §YEastwatch§! areas which do NOT have the modifier §YAbandoned Castle§! will also receive the same modifier.\n"
 promote_loyalty_rangers: "Prepare the Brothers for Battle"
 promote_loyalty_rangers_desc: "Allocate our limited resources to the §YOrder of Rangers§! to prepare for a future armed conflict with the Wildlings, training them for all possible encounters.\n\n§RYou may only activate one effect from any §YOrder§! of the Watch every five years.§!\n "

 # Vassal Taxation Mechanic
 sk_event.500.title: "Demand Oaths of Fealty"
 sk_event.500.desc: "The realm is in a state of unrest, and it is imperative that we ensure the loyalty of our vassal lords. We will demand that all of our vassal lords swear oaths of fealty to us, pledging their allegiance and support in these trying times.\n\nSome of our more unruly vassals may not find this demand to be in their best interest. A public declaration against our authority could mean rebellion in the future.\n\nEvery vassal lord who kneels will provide §G5%§! of their current treasury as tribute.\nEvery vassal lord who refuses to kneel will be §Routraged§! by our unacceptable decision."
 sk_event.500.option.a: "They will kneel before me!"
 sk_event.500.option.b: "Perhaps this is not the best approach."
 fealty_tax_tt: "Pays §Y[fealty_tax.GetValue]§! ducats to §Y[Root.GetName]§!."
 we_kneel_tt: "[This.Monarch.GetTitle] §Y[This.Monarch.GetName]§! will kneel."
 we_dont_kneel_tt: "[This.Monarch.GetTitle] §Y[This.Monarch.GetName]§! will §RNOT§! kneel."
 
 sk_event.501.title: "Steward's Report: Oaths of Fealty"
 sk_event.501.desc: "Our stewards have compiled a report for us showing us which of our lords bent the knee and which have decided to stand against us."
 sk_event.501.option.a: "Most unfortunate."

 sk_event.502.title: "The Lords' Tax"
 sk_event.502.desc: "In dire times, it is sometimes necessary, for the good of the realm, to levy additional taxes on our vassal lords. We will demand that all of our vassal lords pay a §R25%§! tax, which will be used to maintain the realm and fund our armies. This is a temporary measure, but no doubt our vassals will be displeased with this decision. We must be cautious, as this may lead to a loss of trust and opinion from our vassals, and possibly even rebellion. We must weigh the benefits of this tax against the potential consequences.\n\nEvery vassal lord will provide §G25%§! of their current treasury as tribute and will be greatly upset with us. Historical friends will only provide §G10%§! of their current treasury as tribute."
 sk_event.502.option.a: "They will pay their dues!"
 sk_event.502.option.b: "Perhaps this is not the best approach."
 vassal_tax_tt: "[This.Monarch.GetTitle] §Y[This.Monarch.GetName]§! pays §Y[vassal_tax.GetValue]§! ducats to §Y[Root.GetName]§!."
 vassal_tax_reduced_tt: "[This.Monarch.GetTitle] §Y[This.Monarch.GetName]§! pays §Y[vassal_tax_reduced.GetValue]§! ducats to §Y[Root.GetName]§!."